name: Release Drafter

on:
  push:
    branches:
      - 3.x
      - 2.x
      - 1.x
      - 0.x

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7  # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
