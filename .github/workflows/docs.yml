name: Generate & Deploy Docs

on:
  push:
    tags:
    branches:
      - 3.x
      - 2.x
      - 1.x
      - 0.x

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: github.repository == 'pyinfra-dev/pyinfra'
    steps:
      - name: Clone Source Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch git tags
        run: git fetch --tags origin

      - name: Clone Generated Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: pyinfra-dev/docs.pyinfra.com
          path: docs-public/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv sync --group docs --no-default-groups

      - name: Generate documentation
        run: scripts/build-public-docs.sh
        env:
          PYTHONPATH: '.'

      - name: Push & Update
        run: |
          cd docs-public/

          if [[ `git status --porcelain` ]]; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add .
            git commit -m "Docs build $(date -I)"
            git push origin HEAD:main
          fi
