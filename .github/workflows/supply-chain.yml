name: Supply Chain Security

on:
  push:
    branches: [3.x, 2.x]
    paths:
      - uv.lock
      - pyproject.toml
      - src/**
      - .github/workflows/supply-chain.yml
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - src/**
      - .github/workflows/supply-chain.yml
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  osv-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Download osv-scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
      - name: Scan dependencies
        id: scan
        continue-on-error: true
        run: |
          ./osv-scanner \
            --lockfile uv.lock \
            --format sarif \
            --output osv-results.sarif
      - name: Upload SARIF to security tab
        if: always() && steps.scan.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb # v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
      - name: Upload scan artifact
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-results
          path: osv-results.sarif
          if-no-files-found: warn
          retention-days: 30

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --group test --no-default-groups
      - name: Generate CycloneDX SBOM
        run: |
          uv run --with pip-audit pip-audit \
            --format=cyclonedx-json \
            --output=sbom.json \
            --skip-editable \
            --desc=off
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

  bandit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Run Bandit security analysis
        id: bandit
        continue-on-error: true
        run: |
          uv run --with bandit bandit \
            -r src/ \
            -f sarif \
            -o bandit-results.sarif \
            --exclude tests \
            -ll
      - name: Upload SARIF to security tab
        if: always() && steps.bandit.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb # v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit
      - name: Upload scan artifact
        if: always() && steps.bandit.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-results
          path: bandit-results.sarif
          if-no-files-found: warn
          retention-days: 30
