name: Lint & Test

on:
  push:
    branches:
      - 3.x
      - 2.x
      - 1.x
      - 0.x
  pull_request:

jobs:
  # Linting
  #

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: "pyproject.toml"
          args: "check --diff --unsafe-fixes"
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: "pyproject.toml"
          args: "format --diff"

  type-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --group test --no-default-groups
      - run: uv run mypy
      - run: uv run python scripts/lint_arguments_sync.py

  spell-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  unit-test:
    needs:
      - lint
      - type-check
      - spell-check
    strategy:
      matrix:
        os: [macos-26, macos-15, windows-2025, windows-2022, ubuntu-24.04, ubuntu-22.04]
        # Test every OS vs. the default Python version (the newest stable release), and only one for
        # supported Python versions below that
        python-version: ["3.14"]
        include:
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: ubuntu-24.04
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --group test --no-default-groups --python=${{ matrix.python-version }}
      - run: uv run pytest --cov --disable-warnings
      - name: Upload coverage report to codecov
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.14' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7

  # End-to-end tests
  #

  end-to-end-test:
    needs:
      - lint
      - type-check
      - spell-check
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        test-name: [local, ssh, docker, podman]
        include:
          - os: macos-15
            test-name: local
          - os: macos-26
            test-name: local
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --group test --no-default-groups --python=${{ matrix.python-version }}
      - run: uv run pytest -m end_to_end_${{ matrix.test-name }}

  docs-build:
    needs:
      - lint
      - type-check
      - spell-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch git tags
        run: git fetch --tags origin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: |
          uv sync --group docs --no-default-groups
          uv pip install 'jinja2<3.1'
      - name: Generate documentation
        run: scripts/build-public-docs.sh
        env:
          PYTHONPATH: '.'

  # Finally, single job to check if all completed, for use in protected branch

  tests-done:
    if: ${{ always() }}
    needs:
      - lint
      - type-check
      - spell-check
      - unit-test
      - end-to-end-test
      - docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: matrix-org/done-action@3409aa904e8a2aaf2220f09bc954d3d0b0a2ee67 # v3
        with:
          needs: ${{ toJSON(needs) }}
