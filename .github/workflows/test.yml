name: Lint & Test

on:
  push:
    branches:
      - 3.x
      - 2.x
      - 1.x
      - 0.x
  pull_request:

jobs:
  # Linting
  #

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          version-file: "pyproject.toml"
          args: "check --diff --unsafe-fixes"
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          version-file: "pyproject.toml"
          args: "format --diff"

  type-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --group test --no-default-groups
      - run: uv run mypy
      - run: uv run python scripts/lint_arguments_sync.py

  spell-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check spelling
        uses: crate-ci/typos@d08e4083f112e684fb88f6babd9ae60a1f1cd84f # v1.30.3

  unit-test:
    needs:
      - lint
      - type-check
      - spell-check
    strategy:
      matrix:
        os: [macos-26, macos-15, macos-14, windows-2025, windows-2022, ubuntu-24.04, ubuntu-22.04]
        # Test every OS vs. the default Python version (the newest stable release), and only one for
        # supported Python versions below that
        python-version: ["3.14"]
        include:
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: ubuntu-24.04
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --group test --no-default-groups --python=${{ matrix.python-version }}
      - run: uv run pytest --cov --disable-warnings
      - name: Upload coverage report to codecov
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.14' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5

  # End-to-end tests
  #

  end-to-end-test:
    needs:
      - lint
      - type-check
      - spell-check
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        test-name: [local, ssh, docker, podman]
        include:
          - os: macos-14
            test-name: local
          - os: macos-15
            test-name: local
          - os: macos-26
            test-name: local
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --group test --no-default-groups --python=${{ matrix.python-version }}
      - run: uv run pytest -m end_to_end_${{ matrix.test-name }}

  docs-build:
    needs:
      - lint
      - type-check
      - spell-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch git tags
        run: git fetch --tags origin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install
        run: |
          uv sync --group docs --no-default-groups
          uv pip install 'jinja2<3.1'
      - name: Generate documentation
        run: scripts/build-public-docs.sh
        env:
          PYTHONPATH: '.'

  # Finally, single job to check if all completed, for use in protected branch

  tests-done:
    if: ${{ always() }}
    needs:
      - lint
      - type-check
      - spell-check
      - unit-test
      - end-to-end-test
      - docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: matrix-org/done-action@3409aa904e8a2aaf2220f09bc954d3d0b0a2ee67 # v3
        with:
          needs: ${{ toJSON(needs) }}
