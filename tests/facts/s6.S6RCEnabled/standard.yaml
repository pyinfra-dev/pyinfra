arg:
  - "default"
command: "s6-rc-set-status default"
requires_command: "s6-rc-set-status"
output: |
  swap/always
  dmesg-srv/always
  dmesg-log/always
  tty1/active
  mount-net/active
  network-detection/active
  tlp/usable
  avahi-daemon-srv/usable
  avahi-daemon-log/usable
fact:
  swap: always
  dmesg-srv: always
  dmesg-log: always
  tty1: active
  mount-net: active
  network-detection: active
  tlp: usable
  avahi-daemon-srv: usable
  avahi-daemon-log: usable
