kwargs:
  wait_for_lock: true
facts:
  apt.SimulateOperationWillChange:
    "command=upgrade":
      upgraded: 15
      newly_installed: 0
      removed: 0
      not_upgraded: 0
commands:
  - DEBIAN_FRONTEND=noninteractive apt-get -y -o DPkg::Lock::Timeout=60 -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" upgrade
