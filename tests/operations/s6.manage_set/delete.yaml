args:
  - default
kwargs:
  present: false
facts:
  server.Command:
    'command=printf %s "$S6_CONF"': ""
  files.FileContents:
    path=/etc/s6.conf: null
  s6.S6RepositoryList:
    repository=None:
      - current
      - default
      - desktop
      - kiosk
  # shows that "default" set exists
  s6.S6SetStatus:
    repository=None, the_set=default:
      tipidee: active
commands:
  - s6-rc-set-delete default
