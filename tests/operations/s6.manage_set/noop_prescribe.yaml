args:
  # when declaring prescriptions, noop is only possible when working on the current set, as others
  # must be loaded first by executing `s6 set load [the_set]`
  - current
kwargs:
  prescriptions:
    nftables: "active"
    mysqld: "masked"
    tipidee: "usable"
  do_commit: false
facts:
  s6.S6SetStatus:
    repository=None, set=current:
      nftables: "active"
      mysqld: "masked"
      tipidee: "usable"
commands: []
noop_description: the set "current" already has the desired prescriptions

