args:
  - default
kwargs:
  prescriptions:
    tipidee: "active"
facts:
  server.Command:
    'command=printf %s "$S6_CONF"': ""
  files.FileContents:
    path=/etc/s6.conf: null
  s6.S6RepositoryList:
    repository=None:
      - current
      - default
      - desktop
      - kiosk
  s6.S6SetStatus:
    repository=None, the_set=default:
      tipidee: "usable"
commands:
  - s6-rc-set-change default active tipidee
  - s6-rc-set-fix default
  - s6-rc-set-commit default
