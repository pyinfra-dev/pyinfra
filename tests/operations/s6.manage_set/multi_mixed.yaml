args:
  - default
kwargs:
  prescriptions:
    nftables: "always"
    mysqld: "active"
    php-fpm: "masked"
    tipidee: "usable"
facts:
  server.Command:
    'command=printf %s "$S6_CONF"': ""
  files.FileContents:
    path=/etc/s6.conf: null
  s6.S6RepositoryList:
    repository=None:
      - current
      - default
      - desktop
      - kiosk
  s6.S6SetStatus:
    repository=None, the_set=default:
      nftables: "active"
      mysqld: "usable"
      php-fpm: "usable"
      tipidee: "active"
commands:
  - s6-rc-set-change default always nftables
  - s6-rc-set-change default active mysqld
  - s6-rc-set-change default usable tipidee
  - s6-rc-set-change default masked php-fpm
  - s6-rc-set-fix default
  - s6-rc-set-commit default
