args:
  - default
kwargs:
  present: true
  do_commit: false
facts:
  server.Command:
    'command=printf %s "$S6_CONF"': 
      /etc/s6-stuff/repositories/bleeding-edge
  files.FileContents:
    path=/etc/s6-stuff/repositories/bleeding-edge:
      [ "repodir = /etc/s6-stuff/repositories/bleeding-edge" ]
  s6.S6RepositoryList:
    repository=/etc/s6-stuff/repositories/bleeding-edge:
      - current
      - desktop
      - kiosk
commands:
  - s6-rc-set-new -r /etc/s6-stuff/repositories/bleeding-edge default
