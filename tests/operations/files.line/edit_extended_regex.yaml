args:
  - somefile
  - match_line.+
kwargs:
  replace: replace_line
  extended_regex: true
facts:
  files.FindInFile:
    "extended_regex=True, interpolate_variables=False, path=somefile, pattern=^.*match_line.+.*$":
      - match_line some value
commands:
  - "sed -E -i.a-timestamp 's/^.*match_line.+.*$/replace_line/' somefile && rm -f somefile.a-timestamp"
