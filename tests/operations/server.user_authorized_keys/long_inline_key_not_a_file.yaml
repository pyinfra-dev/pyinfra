# Long inline public keys must not be treated as files: on Python < 3.14
# Path.exists() raises OSError (ENAMETOOLONG) for such values, see
# https://github.com/pyinfra-dev/pyinfra/issues/1907
args:
  - someuser
kwargs:
  public_keys:
    - ssh-rsa  bob
facts:
  server.Home:
    user=someuser: /home/someuser
  files.Directory:
    path=/home/someuser/.ssh:
      user: someuser
      group: someuser
      mode: 700
  files.File:
    path=/home/someuser/.ssh/authorized_keys:
      user: someuser
      group: someuser
      mode: 600
  server.AuthorizedKeys:
    path=/home/someuser/.ssh/authorized_keys, user=someuser: []
  files.FindInFile:
    extended_regex=False, interpolate_variables=False, path=/home/someuser/.ssh/authorized_keys, pattern=^.*ssh-rsa  bob.*$: []
commands:
  - "( [ $(tail -c1 /home/someuser/.ssh/authorized_keys | wc -l) -eq 0 ] && echo ; echo 'ssh-rsa  bob' ) >> /home/someuser/.ssh/authorized_keys"
