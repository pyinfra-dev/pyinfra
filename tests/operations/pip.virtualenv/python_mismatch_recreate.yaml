kwargs:
  path: /some/virtualenv
  python: python3.14
  venv: true
  on_mismatch: recreate
facts:
  files.File:
    path=/some/virtualenv/bin/activate: true
  files.Directory:
    path=/some/virtualenv: true
  pip.PythonVersion:
    python=/some/virtualenv/bin/python: [3, 12, 11]
    python=python3.14: [3, 14, 7]
commands:
  - rm -rf /some/virtualenv
  - python3.14 -m venv /some/virtualenv
