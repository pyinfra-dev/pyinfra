args:
  - default
kwargs:
  prescriptions:
    tipidee: "active"
  force_save: true
  backup: true
facts:
  files.FindInFile:
    'extended_regex=True, interpolate_variables=False, path=/etc/s6-frontend.conf, pattern=repodir\\s*=':
      - repodir=/etc/s6/repo
  s6.S6SetStatus:
    repository=None, set=default:
      tipidee: "usable"
commands:
  - s6 set load default
  - s6 set enable tipidee
  - s6 set check -F
  - s6 set commit
