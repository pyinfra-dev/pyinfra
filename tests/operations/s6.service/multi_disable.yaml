args:
  - [ nftables, mysqld, tipidee ]
kwargs:
  running: null
  enabled: false
facts:
  s6.S6SetStatus:
    repository=None, set=current:
      nftables: "active"
      mysqld: "active"
      tipidee: "active"
commands:
  - s6 set disable nftables mysqld tipidee
  - s6 set check -F
  - s6 set commit
