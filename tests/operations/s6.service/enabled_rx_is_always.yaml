args:
  - tipidee
kwargs:
  enabled: true
  enabled_rx: always
facts:
  server.Command:
    'command=printf %s "$S6_CONF"': ""
  files.FileContents:
    path=/etc/s6.conf: null
  s6.S6RepositoryList:
    repodir=None:
      - current
  s6.S6SetStatus:
    repodir=None, the_set=current:
      tipidee: usable
commands:
  - s6 set make-essential -p -s current tipidee
