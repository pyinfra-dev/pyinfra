args:
  - tipidee
kwargs:
  enabled: true
  enabled_rx: always
facts:
  server.Command:
    'command=printf %s "$S6_CONF"': ""
  files.FileContents:
    path=/etc/s6.conf: null
  s6.S6RepositoryList:
    repository=None:
      - current
  s6.S6SetStatus:
    repository=None, the_set=current:
      tipidee: usable
commands:
  - s6-rc-set-change current always tipidee
  - s6-rc-set-fix current
  - s6-rc-set-commit current
