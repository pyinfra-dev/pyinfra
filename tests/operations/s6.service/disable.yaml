args:
  - tipidee
kwargs:
  running: null
  enabled: false
facts:
  server.Command:
    'command=printf %s "$S6_CONF"': ""
  files.FileContents:
    path=/etc/s6.conf: null
  s6.S6RepositoryList:
    repodir=None:
      - current
  s6.S6SetStatus:
    repodir=None, the_set=current:
      tipidee: "active"
commands:
  - s6 set disable -p -s current tipidee
