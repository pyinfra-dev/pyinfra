kwargs:
  username: ci
  password: s3cret
  server: myregistry.io:5000
  docker_cmd: podman
facts:
  docker.DockerAuths: []
commands:
  - raw: "printf '%s' s3cret | podman login --username ci --password-stdin myregistry.io:5000"
    masked: "printf '%s' '*MASKED*' | podman login --username ci --password-stdin myregistry.io:5000"
