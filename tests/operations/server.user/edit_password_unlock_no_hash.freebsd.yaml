args: [someuser]
kwargs:
  ensure_home: false
  password_lock: false
facts:
  server.Os: FreeBSD
  server.Users:
    someuser:
      home: /home/someuser
      shell: /bin/bash
      group: someuser
      groups: []
      comment: ""
      password: '*LOCKED**'
  server.Groups: [someuser]
commands:
  - pw usermod -n someuser -w none
