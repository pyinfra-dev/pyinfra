args: [someuser]
kwargs:
  ensure_home: false
  password: $somecryptedpassword$
  password_lock: true
facts:
  server.Os: Linux
  server.Users: {}
  server.Groups: {}
  server.Which:
    command=useradd: /usr/sbin/useradd
    command=usermod: /usr/sbin/usermod
commands:
  - useradd -d /home/someuser -M -p '$somecryptedpassword$' someuser
  - usermod -L someuser
