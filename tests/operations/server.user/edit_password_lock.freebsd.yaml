args: [someuser]
kwargs:
  ensure_home: false
  password_lock: true
facts:
  server.Os: FreeBSD
  server.Users:
    someuser:
      home: /home/someuser
      shell: /bin/bash
      group: someuser
      groups: []
      comment: ""
      password: '$6$somehash'
  server.Groups: [someuser]
  server.Which:
    command=usermod: /usr/sbin/usermod
commands:
  - pw lock someuser
