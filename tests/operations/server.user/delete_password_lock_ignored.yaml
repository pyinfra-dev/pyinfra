args: [someuser]
kwargs:
  present: false
  password_lock: false
facts:
  server.Os: OpenBSD
  server.Users:
    someuser:
      home: /home/someuser
      shell: /bin/bash
      group: someuser
      groups: []
      comment: ""
      password: '*'
  server.Groups: [someuser]
commands:
  - userdel someuser
