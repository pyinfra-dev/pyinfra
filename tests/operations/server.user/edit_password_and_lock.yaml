args: [someuser]
kwargs:
  ensure_home: false
  password: $newhash$
  password_lock: true
facts:
  server.Os: Linux
  server.Users:
    someuser:
      home: /home/someuser
      shell: /bin/bash
      group: someuser
      groups: []
      comment: ""
      password: '$oldhash$'
  server.Groups: [someuser]
  server.Which:
    command=usermod: /usr/sbin/usermod
commands:
  - usermod -p '$newhash$' someuser
  - usermod -L someuser
