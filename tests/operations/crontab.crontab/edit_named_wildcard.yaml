# https://github.com/pyinfra-dev/pyinfra/issues/2026
args:
  - borg prune --glob-archives daily-* --keep-last 6
kwargs:
  cron_name: backup
  special_time: "@daily"
facts:
  crontab.Crontab:
    user=None:
      borg prune --glob-archives weekly-* --keep-last 6:
        special_time: "@weekly"
        comments:
          - "# pyinfra-name=backup"
commands:
  - crontab -l > _tempfile_
  - sed -i.a-timestamp 's/.*borg prune --glob-archives weekly-\* --keep-last 6.*/@daily borg prune --glob-archives daily-* --keep-last 6/' _tempfile_ && rm -f _tempfile_.a-timestamp
  - crontab _tempfile_
