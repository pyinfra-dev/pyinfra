args:
  - echo done
kwargs:
  cron_name: anchors
  special_time: "@daily"
facts:
  crontab.Crontab:
    user=None:
      echo $HOME ^x$:
        special_time: "@weekly"
        comments:
          - "# pyinfra-name=anchors"
commands:
  - 'crontab -l > _tempfile_'
  - 'sed -i.a-timestamp ''s/.*echo $HOME ^x$.*/@daily echo done/'' _tempfile_ && rm -f _tempfile_.a-timestamp'
  - 'crontab _tempfile_'
