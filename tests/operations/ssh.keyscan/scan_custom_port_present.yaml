args:
  - remote-host.net
kwargs:
  port: 2222
facts:
  server.Home: /home/pyinfra
  files.Directory:
    path=/home/pyinfra/.ssh:
      mode: 700
  files.FindInFile:
    extended_regex=False, interpolate_variables=False, path=/home/pyinfra/.ssh/known_hosts, pattern=remote-host.net:
      - '[remote-host.net]:2222 ssh-ed25519 AAAA'
commands: []
noop_description: host key for [remote-host.net]:2222 already exists
