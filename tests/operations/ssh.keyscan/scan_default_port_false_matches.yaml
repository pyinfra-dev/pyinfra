args:
  - remote-host.net
facts:
  server.Home: /home/pyinfra
  files.Directory:
    path=/home/pyinfra/.ssh:
      mode: 700
  files.FindInFile:
    extended_regex=False, interpolate_variables=False, path=/home/pyinfra/.ssh/known_hosts, pattern=remote-host.net:
      - '[remote-host.net]:2222 ssh-ed25519 AAAA'
      - other-remote-host.net ssh-ed25519 AAAA
      - remote-host.net.example ssh-ed25519 AAAA
      - remote-hostXnet ssh-ed25519 AAAA
      - other.net ssh-ed25519 AAAA remote-host.net
      - '# remote-host.net ssh-ed25519 AAAA'
      - '#alias.net,remote-host.net ssh-ed25519 AAAA'
      - '@cert-authority [remote-host.net]:2222 ssh-ed25519 AAAA'
commands:
  - ssh-keyscan -p 22 remote-host.net >> /home/pyinfra/.ssh/known_hosts
