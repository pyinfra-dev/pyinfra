args:
  - remote-host.net
facts:
  server.Home: /home/pyinfra
  files.Directory:
    path=/home/pyinfra/.ssh:
      mode: 700
  files.FindInFile:
    extended_regex=False, interpolate_variables=False, path=/home/pyinfra/.ssh/known_hosts, pattern=remote-host.net:
      - ''
      - '   '
      - remote-host.net
      - remote-host.net ssh-ed25519
      - '@cert-authority'
      - '@cert-authority remote-host.net'
commands:
  - ssh-keyscan -p 22 remote-host.net >> /home/pyinfra/.ssh/known_hosts
