args:
  - redis-server.service
kwargs:
  running: false
  masked: true
  user_mode: true
facts:
  systemd.SystemdStatus:
    "machine=None, services=['redis-server.service'], user_mode=True, user_name=None":
      redis-server.service: false
  systemd.SystemdMasked:
    "machine=None, services=['redis-server.service'], user_mode=True, user_name=None":
      redis-server.service: null
commands:
  - systemctl --user mask redis-server.service
