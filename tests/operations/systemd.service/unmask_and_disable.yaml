# While masked the unit reports "masked" rather than whether it is enabled, and
# masking keeps the enable symlinks, so it is disabled after unmasking.
args:
  - redis-server.service
kwargs:
  running: false
  enabled: false
  masked: false
facts:
  systemd.SystemdStatus:
    "machine=None, services=['redis-server.service'], user_mode=False, user_name=None":
      redis-server.service: false
  systemd.SystemdMasked:
    "machine=None, services=['redis-server.service'], user_mode=False, user_name=None":
      redis-server.service: masked
  systemd.SystemdEnabled:
    "machine=None, services=['redis-server.service'], user_mode=False, user_name=None":
      redis-server.service: false
commands:
  - systemctl unmask redis-server.service
  - systemctl disable redis-server.service
