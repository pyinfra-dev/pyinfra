args:
  - work_mem
kwargs:
  value: "8MB"
facts:
  postgres.PostgresConfiguration:
    "psql_database=None, psql_host=None, psql_password=None, psql_port=None, psql_user=None":
      work_mem:
        value: "4096"
        unit: kB
        source: default
        context: user
commands:
  - "psql -Ac 'ALTER SYSTEM SET work_mem = '\"'\"'8MB'\"'\"''"
