args:
  - work_mem
kwargs:
  present: false
facts:
  postgres.PostgresConfiguration:
    "psql_database=None, psql_host=None, psql_password=None, psql_port=None, psql_user=None":
      work_mem:
        value: "4096"
        unit: kB
        source: default
        context: user
commands: []
noop_description: "postgresql setting work_mem is already at its default"
