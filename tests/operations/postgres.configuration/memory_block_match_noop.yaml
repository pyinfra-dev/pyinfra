args:
  - shared_buffers
kwargs:
  value: "128MB"
facts:
  postgres.PostgresConfiguration:
    "psql_database=None, psql_host=None, psql_password=None, psql_port=None, psql_user=None":
      shared_buffers:
        value: "16384"
        unit: "8kB"
        source: configuration file
        context: postmaster
commands: []
noop_description: "postgresql setting shared_buffers is already set to 128MB"
