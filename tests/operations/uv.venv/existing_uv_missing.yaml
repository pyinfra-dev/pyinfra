# Without uv the UvPythonVersion fact yields its default; a healthy venv must be kept.
args:
  - /somewhere/useful/.venv
kwargs:
  python: "3.13"
facts:
  files.File:
    path=/somewhere/useful/.venv/bin/activate: true
  pip.PythonVersion:
    python=/somewhere/useful/.venv/bin/python: [3, 13, 4]
  uv.UvPythonVersion:
    request=3.13: null
commands: []
noop_description: venv already exists at /somewhere/useful/.venv but the requested Python 3.13 was not found, so its version was not checked
