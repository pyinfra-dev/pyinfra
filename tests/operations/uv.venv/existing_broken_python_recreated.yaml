args:
  - /somewhere/useful/.venv
facts:
  files.File:
    path=/somewhere/useful/.venv/bin/activate: true
  files.Directory:
    path=/somewhere/useful/.venv: true
  pip.PythonVersion:
    python=/somewhere/useful/.venv/bin/python: null
commands:
  - rm -rf /somewhere/useful/.venv
  - uv venv /somewhere/useful/.venv
