args:
  - /somewhere/useful/.venv
kwargs:
  python: "3.15"
  seed: true
  on_mismatch: recreate
facts:
  files.File:
    path=/somewhere/useful/.venv/bin/activate: true
  pip.PythonVersion:
    python=/somewhere/useful/.venv/bin/python: [3, 13, 4]
  server.Which:
    command=uv: /usr/local/bin/uv
  uv.UvPythonVersion:
    request=3.15: [3, 15, 0]
commands:
  - uv venv --clear --seed --python 3.15 /somewhere/useful/.venv
