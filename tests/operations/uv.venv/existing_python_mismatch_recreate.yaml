args:
  - /somewhere/useful/.venv
kwargs:
  python: "3.15"
  seed: true
  on_mismatch: recreate
facts:
  files.File:
    path=/somewhere/useful/.venv/bin/activate: true
  files.Directory:
    path=/somewhere/useful/.venv: true
  uv.UvPythonVersion:
    request=/somewhere/useful/.venv/bin/python: [3, 13, 4]
    request=3.15: [3, 15, 0]
commands:
  - rm -rf /somewhere/useful/.venv
  - uv venv --seed --python 3.15 /somewhere/useful/.venv
