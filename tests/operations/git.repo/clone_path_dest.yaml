# str(Path) renders with backslashes on Windows, breaking the fake fact lookup
require_platform:
  - Darwin
  - Linux
args:
  - myrepo
  - "path:/home/myrepo"
kwargs:
  branch: mybranch
  user: myuser
  pull: false
facts:
  files.Directory:
    "path=/home/myrepo": {}
    "path=/home/myrepo/.git": null
commands:
  - cd /home/myrepo && git clone myrepo --branch mybranch .
  - chown -R myuser /home/myrepo
